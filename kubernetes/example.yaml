apiVersion: v1
kind: Secret
metadata:
  name: rustdesk-api-secret
type: Opaque
stringData:
  API_JWT_SECRET: "replace-with-at-least-32-random-bytes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustdesk
  template:
    metadata:
      labels:
        app: rustdesk
    spec:
      containers:
        # id Server (HBBS)
        - name: hbbs
          image: rustdesk/rustdesk-server:latest
          command: ["hbbs", "-r", "rustdesk.yourdomain.tld:21117", "-k", "_"]
          volumeMounts:
            - mountPath: /root
              name: rustdesk-data
          ports:
            - containerPort: 21115
            - containerPort: 21116
              protocol: TCP
            - containerPort: 21116
              protocol: UDP
            - containerPort: 21118

        # Relay Server (HBBR)
        - name: hbbr
          image: rustdesk/rustdesk-server:latest
          command: ["hbbr", "-k", "_"]
          volumeMounts:
            - mountPath: /root
              name: rustdesk-data
          ports:
            - containerPort: 21117
            - containerPort: 21119

        # Optional HTTP API and Web Admin backend. Serve web/dist separately or mount it at /root/web.
        - name: rustdesk-api
          image: rustdesk/rustdesk-server:latest
          env:
            - name: API_ENABLED
              value: "1"
            - name: API_BIND
              value: "0.0.0.0"
            - name: API_PORT
              value: "21114"
            - name: API_REGISTER_ENABLED
              value: "0"
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rustdesk-api-secret
                  key: API_JWT_SECRET
            - name: DB_URL
              value: /root/db_v2.sqlite3
            - name: RUSTDESK_KEY_FILE
              value: /root/id_ed25519.pub
            - name: API_WEB_ROOT
              value: /root/web
          volumeMounts:
            - mountPath: /root
              name: rustdesk-data
          ports:
            - containerPort: 21114
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/live
              port: 21114
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 21114
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: rustdesk-data
          persistentVolumeClaim:
            claimName: rustdesk-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk-service
spec:
  type: LoadBalancer # Or NodePort
  selector:
    app: rustdesk
  ports:
    - name: hbbs-tcp
      port: 21115
      targetPort: 21115
      protocol: TCP
    - name: hbbs-udp
      port: 21116
      targetPort: 21116
      protocol: UDP
    - name: hbbs-tcp-main
      port: 21116
      targetPort: 21116
      protocol: TCP
    - name: hbbr-tcp
      port: 21117
      targetPort: 21117
      protocol: TCP
    - name: api-http
      port: 21114
      targetPort: 21114
      protocol: TCP
    - name: hbbs-websocket
      port: 21118
      targetPort: 21118
      protocol: TCP
    - name: hbbr-websocket
      port: 21119
      targetPort: 21119
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustdesk-pvc
spec:
  accessModes:
    - ReadWriteOnce # RWM would be available only with pro version
  resources:
    requests:
      storage: 1Gi
