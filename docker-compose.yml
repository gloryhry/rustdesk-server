version: '3'

networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r rustdesk.example.com:21117
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  rustdesk-api:
    container_name: rustdesk-api
    profiles: ["api"]
    ports:
      - 127.0.0.1:21114:21114
    image: rustdesk/rustdesk-server:latest
    command: rustdesk-api
    environment:
      - API_ENABLED=1
      - API_BIND=0.0.0.0
      - API_JWT_SECRET=${API_JWT_SECRET:-local-test-jwt-secret-32-bytes-minimum}
      - API_BOOTSTRAP_ADMIN_USERNAME=${API_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - API_BOOTSTRAP_ADMIN_PASSWORD=${API_BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
      - API_REGISTER_ENABLED=${API_REGISTER_ENABLED:-0}
      - DB_URL=/root/db_v2.sqlite3
      - RUSTDESK_KEY_FILE=/root/id_ed25519.pub
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbs
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 21117:21117
      - 21119:21119
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    restart: unless-stopped
