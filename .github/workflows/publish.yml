name: Build and publish

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Rust and Web artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test image verification modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/deployment -p test_multiarch.py

      - name: Test Rust targets
        run: cargo test --locked --all-targets

      - name: Build Rust release binaries
        run: cargo build --locked --release --bins

      - name: Build Web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -C target/release -czf bundle/rustdesk-server-linux-amd64.tar.gz \
            hbbs hbbr rustdesk-api rustdesk-utils
          tar -C web -czf bundle/rustdesk-api-web.tar.gz dist

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: bundle
          if-no-files-found: error

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/hbbs
            target/release/hbbr
            target/release/rustdesk-api
            target/release/rustdesk-utils
          if-no-files-found: error

      - name: Upload Web assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: web/dist
          if-no-files-found: error

  debian:
    name: Build Debian packages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential debhelper devscripts dpkg-dev fakeroot pkg-config

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: debian-build/amd64/bin

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          chmod a+x debian-build/amd64/bin/*
          cp -a debian systemd debian-build/amd64/
          sed 's/{{ ARCH }}/amd64/' debian/control.tpl > debian-build/amd64/debian/control
          cd debian-build/amd64
          dpkg-buildpackage -us -uc -b -aamd64
          mkdir -p ../../debian-assets
          cp ../*.deb ../../debian-assets/

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-assets
          path: debian-assets/*.deb
          if-no-files-found: error

  docker:
    name: Build and verify GHCR image (${{ matrix.platform }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { platform: 'linux/amd64', artifact: amd64 }
          - { platform: 'linux/arm64', artifact: arm64 }
          - { platform: 'linux/arm/v7', artifact: armv7 }
          - { platform: 'linux/386', artifact: i386 }
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm,386

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push GHCR image by digest
        id: image_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-runtime-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=ghcr-runtime-${{ matrix.artifact }},ignore-error=true

      - name: Verify uploaded runtime image and record digest
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.image_build.outputs.digest }}
          LOG_DIR: ${{ runner.temp }}/ghcr-check-${{ matrix.artifact }}
          DIGEST_FILE: ${{ runner.temp }}/digests/${{ matrix.artifact }}.json
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${DIGEST:?Missing image digest}"
          docker pull --platform "$PLATFORM" "$image_ref"
          python3 tests/deployment/multiarch.py --platform "$PLATFORM" --image "$image_ref" --log-dir "$LOG_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['LOG_DIR']) / 'result.json').read_text())
          image = os.environ['IMAGE_NAME']
          digest = os.environ['DIGEST']
          platform = os.environ['PLATFORM']
          revision = os.environ['GITHUB_SHA']
          if (report['result'] != 'passed' or report['checks'] != ['runtime']
                  or report['platform'] != platform or report['head'] != revision
                  or report['image'] != image + '@' + digest):
              raise SystemExit('Runtime verification report does not match this release')
          record = {'platform': platform, 'image': image, 'digest': digest, 'revision': revision}
          destination = Path(os.environ['DIGEST_FILE'])
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Upload verified digest
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/${{ matrix.artifact }}.json
          if-no-files-found: error

      - name: Preserve image verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-check-${{ matrix.artifact }}
          path: ${{ runner.temp }}/ghcr-check-${{ matrix.artifact }}
          if-no-files-found: warn

  docker-manifest:
    name: Publish verified multi-platform GHCR tags
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified digests
        uses: actions/download-artifact@v4
        with:
          pattern: ghcr-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Merge and verify multi-platform tags
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.path.insert(0, 'tests/deployment')
          from multiarch import PLATFORMS

          image = os.environ['IMAGE_NAME']
          revision = os.environ['GITHUB_SHA']
          records = {}
          files = list(Path(os.environ['DIGEST_DIR']).glob('*.json'))
          if len(files) != len(PLATFORMS):
              raise SystemExit('Expected exactly four verified platform digests')
          for path in files:
              record = json.loads(path.read_text())
              platform = record['platform']
              digest = record['digest']
              if (platform not in PLATFORMS or platform in records
                      or record['image'] != image or record['revision'] != revision
                      or re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None):
                  raise SystemExit('Invalid, duplicate or stale platform digest record')
              records[platform] = digest
          if set(records) != set(PLATFORMS) or len(set(records.values())) != len(PLATFORMS):
              raise SystemExit('Verified platform digests are incomplete or duplicated')

          def check_manifest(manifest):
              entries = manifest.get('manifests', [])
              platforms = {}
              if len(entries) != len(PLATFORMS):
                  raise SystemExit('Manifest must contain exactly four platform descriptors')
              for entry in entries:
                  target = entry['platform']
                  platform = target['os'] + '/' + target['architecture']
                  variant = target.get('variant', '')
                  if target['architecture'] == 'arm':
                      platform += '/' + variant
                  elif variant and not (target['architecture'] == 'arm64' and variant == 'v8'):
                      raise SystemExit('Unexpected platform variant in manifest')
                  digest = entry['digest']
                  if (platform not in PLATFORMS or platform in platforms
                          or re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None):
                      raise SystemExit('Unexpected or duplicate platform in manifest')
                  platforms[platform] = digest
              if set(platforms) != set(PLATFORMS):
                  raise SystemExit('Manifest platform set does not match the release matrix')
              return platforms

          tags = json.loads(os.environ['METADATA_JSON'])['tags']
          if (not tags or len(tags) != len(set(tags))
                  or any(not tag.startswith(image + ':') for tag in tags)):
              raise SystemExit('Image metadata contains invalid release tags')
          sources = [image + '@' + records[platform] for platform in PLATFORMS]
          create = ['docker', 'buildx', 'imagetools', 'create']
          candidate = json.loads(subprocess.check_output([*create, '--dry-run', *sources], text=True))
          expected = check_manifest(candidate)
          tag_args = [argument for tag in tags for argument in ('--tag', tag)]
          subprocess.run([*create, *tag_args, *sources], check=True)
          published_digest = None
          for tag in tags:
              inspect = ['docker', 'buildx', 'imagetools', 'inspect', tag]
              manifest = json.loads(subprocess.check_output([*inspect, '--raw'], text=True))
              if check_manifest(manifest) != expected:
                  raise SystemExit('Published manifest differs from the verified candidate')
              digest = subprocess.check_output([*inspect, '--format', '{{.Manifest.Digest}}'], text=True).strip()
              if (re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None
                      or (published_digest is not None and digest != published_digest)):
                  raise SystemExit('Published tags do not reference the same manifest digest')
              published_digest = digest
              print(tag + '@' + digest + ': all four platforms verified')
          PY

  release:
    name: Create GitHub Release
    needs:
      - build
      - debian
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          name: debian-assets
          path: assets

      - name: Create Pre-release for branch push
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ github.sha }}
          name: Pre-release ${{ github.sha }}
          prerelease: true
          draft: false
          generate_release_notes: false
          files: assets/*

      - name: Create formal release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RustDesk Server ${{ github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: assets/*
