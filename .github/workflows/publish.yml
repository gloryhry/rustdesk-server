name: Build and publish

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Rust and Web artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Rust targets
        run: cargo test --locked --all-targets

      - name: Build Rust release binaries
        run: cargo build --locked --release --bins

      - name: Build Web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -C target/release -czf bundle/rustdesk-server-linux-amd64.tar.gz \
            hbbs hbbr rustdesk-api rustdesk-utils
          tar -C web -czf bundle/rustdesk-api-web.tar.gz dist

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: bundle
          if-no-files-found: error

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/hbbs
            target/release/hbbr
            target/release/rustdesk-api
            target/release/rustdesk-utils
          if-no-files-found: error

      - name: Upload Web assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: web/dist
          if-no-files-found: error

  debian:
    name: Build Debian packages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential debhelper devscripts dpkg-dev fakeroot pkg-config

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: debian-build/amd64/bin

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          chmod a+x debian-build/amd64/bin/*
          cp -a debian systemd debian-build/amd64/
          sed 's/{{ ARCH }}/amd64/' debian/control.tpl > debian-build/amd64/debian/control
          cd debian-build/amd64
          dpkg-buildpackage -us -uc -b -aamd64
          mkdir -p ../../debian-assets
          cp ../*.deb ../../debian-assets/

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-assets
          path: debian-assets/*.deb
          if-no-files-found: error

  docker:
    name: Build and publish GHCR image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs:
      - build
      - debian
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          name: debian-assets
          path: assets

      - name: Create Pre-release for branch push
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ github.sha }}
          name: Pre-release ${{ github.sha }}
          prerelease: true
          draft: false
          generate_release_notes: false
          files: assets/*

      - name: Create formal release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RustDesk Server ${{ github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: assets/*
